# YOLOv8n-seg with channels reduced to approximately one quarter of YOLOv8n.
# Standard YOLOv8n uses width=0.25 relative to the base architecture.
# This model uses width=0.0625 (= 0.25 / 4). Ultralytics aligns channels to multiples of 8.

nc: 2
scale: n

scales:
  # Keep the conventional n scale name because Ultralytics infers it from the filename,
  # but use one quarter of the normal YOLOv8n width (0.25 / 4 = 0.0625).
  n: [0.33, 0.0625, 1024]  # [depth, width, max_channels]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 3, C2f, [256]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, C2f, [512]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 3, C2f, [1024]]

  - [[15, 18, 21], 1, Segment, [nc, 32, 256]]
